# H2 database file stored locally as library.db
spring.datasource.url=jdbc:h2:file:./library
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto-create/update tables from your entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Optional: enables H2's web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Show the error message (e.g. "Book is already borrowed") in API error responses
server.error.include-message=always
# Show which fields failed validation (e.g. "title must not be blank")
server.error.include-binding-errors=always
